<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiyataCreative Logo Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.400.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FDFBF7;
            --bg-secondary: rgba(255, 255, 255, 0.85);
            --text-primary: #1A1514;
            --text-secondary: #4A3E3C;
            --accent: #B28F81;
            --border-subtle: rgba(231, 225, 221, 0.85);
            --gradient-1: #FFE9E3;
            --gradient-2: #F0F0EE;
            --gradient-3: #FDFBF7;
        }

        .dark-theme {
            --bg-primary: #111016;
            --bg-secondary: rgba(26, 24, 33, 0.85);
            --text-primary: #FFFFFF;
            --text-secondary: #E0DEE8;
            --accent: #9A86A8;
            --border-subtle: rgba(54, 50, 68, 0.85);
            --gradient-1: #1C152B;
            --gradient-2: #111016;
            --gradient-3: #221D32;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
            background-size: 400% 400%;
            animation: gradient-breath 20s ease infinite;
            color: var(--text-primary);
            transition: background 0.4s ease, color 0.4s ease;
        }

        @keyframes gradient-breath {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: var(--bg-secondary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: 1.25rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .link-underline {
            position: relative;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .link-underline.active {
            color: var(--text-primary);
            font-weight: 500;
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl flex justify-between items-center mb-8">
        <div>
            <span class="text-xs uppercase tracking-widest text-[var(--accent)] font-semibold">Official Lockup</span>
            <h1 class="text-2xl md:text-3xl font-light text-[var(--text-primary)]">Tight Spacing Verification</h1>
        </div>
        <button id="themeToggle" class="px-4 py-2 rounded-full glass-card flex items-center gap-2 hover:opacity-80 transition cursor-pointer" aria-label="Toggle Dark Mode">
            <i data-lucide="moon" class="w-4 h-4 text-[var(--text-primary)]"></i>
            <span class="text-sm font-medium">Toggle Theme</span>
        </button>
    </div>

    <!-- Live Header Preview -->
    <div class="w-full max-w-4xl glass-card p-8 mb-8 shadow-sm">
        <nav class="w-full flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <a href="index.html" class="flex flex-col gap-1 group">
                <img src="miyata_logo.svg" alt="MiyataCreative Logo" class="h-8 md:h-10 w-auto object-contain opacity-95 group-hover:opacity-100 transition-all" />
                <span class="text-xs text-[var(--text-secondary)] opacity-80 group-hover:opacity-100 transition-opacity">Accessibility Digital Experience Designer</span>
            </a>
            <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm md:text-base font-medium">
                <a href="#" class="link-underline active">Home</a>
                <a href="#" class="link-underline">Work</a>
                <a href="#" class="link-underline">About</a>
                <a href="#" class="link-underline">Philosophy</a>
                <a href="#" class="link-underline">Contact</a>
            </div>
        </nav>
    </div>

    <!-- Zoomed Inspection Card -->
    <div class="w-full max-w-4xl glass-card p-12 text-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-[var(--accent)] mb-4 block">Zoomed Close-Up</span>
        <div class="flex items-center justify-center p-8 bg-stone-100/50 dark:bg-stone-900/50 rounded-2xl border border-[var(--border-subtle)]">
            <img src="miyata_logo.svg" alt="MiyataCreative Logo" class="h-16 md:h-20 w-auto object-contain" />
        </div>
        <p class="text-sm text-[var(--text-secondary)] mt-6">
            The excess spacing has been eliminated. The cloud emblem and typography sit naturally together in a cohesive, balanced lockup.
        </p>
    </div>

    <script>
        lucide.createIcons();

        const toggleBtn = document.getElementById('themeToggle');
        toggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark-theme');
            const isDark = document.documentElement.classList.contains('dark-theme');
            toggleBtn.querySelector('i').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });
    </script>
</body>
</html>
