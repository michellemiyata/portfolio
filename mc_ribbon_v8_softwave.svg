<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .wave-m { fill: #1A1514; }
    .wave-c { fill: #B28F81; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 0.08em; fill: #1A1514; }
    .text-sub { font-size: 17px; font-weight: 400; letter-spacing: 0.08em; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .wave-m { fill: #FFFFFF; }
      .wave-c { fill: #9A86A8; }
