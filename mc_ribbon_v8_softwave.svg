    <path d="M 12 30 C 14 18, 18 6, 24 6 C 28 6, 30 10, 28 16 C 26 22, 20 30, 15 30 Z" class="wave-m" />
    <path d="M 23 6 C 29 4, 35 9, 35 17 C 35 25, 29 30, 23 30 L 26 24 C 29 24, 31 21, 31 17 C 31 13, 28 10, 24 10 Z" class="wave-c" />
  </g>
  <text x="52" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
