<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .kamon-ring {
      stroke: #1A1514;
      stroke-width: 3.2;
    }
    .kamon-m {
      stroke: #1A1514;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .kamon-c {
      stroke: #B28F81;
      stroke-width: 3;
      stroke-linecap: round;
    }
    .text-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.08em;
      fill: #1A1514;
    }
    .text-sub {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.08em;
      fill: #4A3E3C;
    }
    @media (prefers-color-scheme: dark) {
      .kamon-ring { stroke: #FFFFFF; }
      .kamon-m { stroke: #FFFFFF; }
      .kamon-c { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- MC Concept 3: Japanese Monogram MC (Circular Crest) -->
  <g transform="translate(6, 4)">
    <!-- Outer Crest Circle -->
    <circle cx="16" cy="16" r="14.5" class="kamon-ring" fill="none" />
    <!-- M Geometry -->
    <path d="M 7 24 V 9 L 16 19 L 25 9 V 24" class="kamon-m" fill="none" />
    <!-- Harmonious C arc inside the crest -->
    <path d="M 23 11 C 26 13, 27 16, 27 19 C 27 23, 24 26, 20 27" class="kamon-c" fill="none" />
  </g>
  <!-- Typography -->
  <text x="50" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
