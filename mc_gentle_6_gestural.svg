<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .gest-dark { stroke: #1A1514; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .gest-rose { stroke: #B28F81; stroke-width: 2.8; stroke-linecap: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .gest-dark { stroke: #FFFFFF; }
      .gest-rose { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Gentle 6: Soft Gestural Flow -->
  <g transform="translate(6, 6)">
    <!-- Elegant brushstroke M -->
    <path d="M 2 26 C 6 22, 10 6, 14 6 C 18 6, 19 14, 18 20 C 19 14, 21 6, 25 6 C 29 6, 31 16, 30 26" class="gest-dark" fill="none" />
    <!-- Graceful calligraphic C sweep -->
    <path d="M 38 9 C 32 4, 25 8, 25 16 C 25 24, 32 28, 38 23" class="gest-rose" fill="none" />
  </g>
  <text x="54" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
