<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .zen-m { stroke: #1A1514; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .zen-c { stroke: #B28F81; stroke-width: 3.2; stroke-linecap: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .zen-m { stroke: #FFFFFF; }
      .zen-c { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Gentle 3: Zen Wave Ribbon -->
  <g transform="translate(6, 6)">
    <!-- Rhythmic Wave M -->
    <path d="M 2 26 C 3 14, 6 6, 11 6 C 16 6, 17 22, 21 22 C 25 22, 26 6, 30 6 C 33 6, 35 12, 33 20" class="zen-m" fill="none" />
    <!-- Harmonious C arc -->
    <path d="M 37 9 C 32 5, 26 8, 26 16 C 26 24, 32 27, 37 23" class="zen-c" fill="none" />
  </g>
  <text x="52" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
