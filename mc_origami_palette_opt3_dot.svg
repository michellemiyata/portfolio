<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .origami-dark { stroke: #1A1514; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .accent-dot { fill: #B28F81; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .origami-dark { stroke: #FFFFFF; }
      .accent-dot { fill: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Option 3: Deep Charcoal with Terracotta Accent Dot -->
  <g transform="translate(6, 4)">
    <path d="M 3 28 C 3 14, 6 6, 12 6 C 16 6, 17 11, 16 17 L 14 26 C 14 28, 12 28, 9 28 Z" class="origami-dark" fill="none" />
    <path d="M 12 28 C 14 18, 18 6, 23 6 C 26 6, 28 10, 27 17 L 25 26 C 25 28, 23 28, 20 28 Z" class="origami-dark" fill="none" />
    <path d="M 24 6 C 30 4, 36 9, 36 17 C 36 25, 29 29, 23 29 L 26 23 C 29 23, 31 20, 31 17 C 31 13, 28 10, 25 10 Z" class="origami-dark" fill="none" />
    <!-- Warm accent dot nestled inside C loop -->
    <circle cx="28" cy="17" r="2.2" class="accent-dot" />
  </g>
  <!-- Typography -->
  <text x="50" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
