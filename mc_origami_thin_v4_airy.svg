<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .airy-m { stroke: #1A1514; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .airy-c { stroke: #B28F81; stroke-width: 1.5; stroke-linecap: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .airy-m { stroke: #FFFFFF; }
      .airy-c { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Thin Variation 4: Airy Minimalist Origami Lettermark -->
  <g transform="translate(6, 6)">
    <!-- Slender airy M line -->
    <path d="M 3 26 V 4 L 14 18 L 25 4 V 26" class="airy-m" fill="none" />
    <!-- Airy sweeping C arc -->
    <path d="M 44 8 C 36 3, 27 6, 27 16 C 27 26, 36 29, 44 24" class="airy-c" fill="none" />
  </g>
  <!-- Typography -->
  <text x="56" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
