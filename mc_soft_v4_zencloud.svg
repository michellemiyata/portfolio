<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .cloud-stroke {
      stroke: #B28F81;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .text-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
      fill: #1A1514;
    }
    .text-sub {
      font-weight: 300;
      fill: #B28F81;
    }
    @media (prefers-color-scheme: dark) {
      .cloud-stroke { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Soft 4: Zen Cloud Monoline -->
  <g transform="translate(6, 6)">
    <!-- Soft cloud enclosure with M & C crest -->
    <path d="M 4 21 C 2 15, 6 9, 12 9 C 14 5, 20 4, 24 8 C 28 5, 34 7, 36 12 C 40 12, 42 16, 40 21" class="cloud-stroke" fill="none" opacity="0.4" />
    <path d="M 10 22 V 12 L 17 19 L 24 12 V 22" class="cloud-stroke" fill="none" />
    <path d="M 34 14 C 30 11, 26 14, 26 18 C 26 22, 30 24, 34 22" class="cloud-stroke" fill="none" />
  </g>
  <!-- Typography -->
  <text x="56" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
