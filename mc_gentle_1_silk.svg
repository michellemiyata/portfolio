<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .silk-m { stroke: #1A1514; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .silk-c { stroke: #B28F81; stroke-width: 3.2; stroke-linecap: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .silk-m { stroke: #FFFFFF; }
      .silk-c { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Gentle 1: Silk Ribbon (Soft Rounded Arches) -->
  <g transform="translate(6, 5)">
    <!-- Soft M arch -->
    <path d="M 4 27 V 10 C 4 5, 8 4, 11 4 C 14 4, 16 7, 16 11 V 22" class="silk-m" fill="none" />
    <path d="M 16 11 C 16 7, 18 4, 21 4 C 24 4, 28 5, 28 10 V 27" class="silk-m" fill="none" />
    <!-- Receptive gentle C sweep -->
    <path d="M 37 8 C 32 4, 25 7, 25 15.5 C 25 24, 32 27, 37 23" class="silk-c" fill="none" />
  </g>
  <!-- Typography -->
  <text x="54" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
