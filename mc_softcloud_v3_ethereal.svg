<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .cloud-outline { stroke: #B28F81; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .mc-soft-dark { stroke: #1A1514; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #B28F81; }
    @media (prefers-color-scheme: dark) {
      .cloud-outline { stroke: #9A86A8; }
      .mc-soft-dark { stroke: #FFFFFF; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Soft Cloud 3: Ethereal Cashmere Cloud -->
  <g transform="translate(6, 4)">
    <path d="M 6 26 H 38 C 42 26, 43 21, 40 17 C 40 12, 34 9, 29 10 C 26 4, 18 4, 14 8 C 9 7, 5 11, 5 17 C 2 20, 2 26, 6 26 Z" class="cloud-outline" fill="none" opacity="0.4" />
    <path d="M 12 22 C 14 16, 17 11, 20 11 C 22 11, 23 15, 24 19 C 25 15, 27 11, 29 11 C 32 11, 33 17, 32 22" class="mc-soft-dark" fill="none" />
    <path d="M 39 13 C 35 10, 31 13, 31 18 C 31 23, 35 25, 39 22" class="mc-soft-dark" fill="none" />
  </g>
  <text x="56" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
