<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .mist-stroke { stroke: #B28F81; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #B28F81; }
    @media (prefers-color-scheme: dark) {
      .mist-stroke { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Soft Cloud 2: Single-Line Cloud Mist (Continuous Floating Line) -->
  <g transform="translate(6, 4)">
    <!-- Continuous cloud swirl forming MC -->
    <path d="M 4 23 C 1 20, 2 13, 8 13 C 10 7, 18 5, 23 9 C 27 6, 35 7, 37 13 C 42 15, 43 21, 39 24" class="mist-stroke" fill="none" opacity="0.4" />
    <path d="M 6 22 C 8 16, 12 11, 16 11 C 19 11, 20 16, 21 21 C 22 16, 24 11, 27 11 C 30 11, 32 17, 31 22" class="mist-stroke" fill="none" />
    <path d="M 37 13 C 33 10, 29 13, 29 18 C 29 23, 34 25, 38 21" class="mist-stroke" fill="none" />
  </g>
  <text x="54" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
