<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .origami-solid { fill: #1A1514; }
    .origami-facet { fill: #332B29; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 0.08em; fill: #1A1514; }
    .text-sub { font-size: 17px; font-weight: 400; letter-spacing: 0.08em; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .origami-solid { fill: #FFFFFF; }
      .origami-facet { fill: #CCCCCC; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Ribbon Variation 3: Origami Fold Ribbon -->
  <g transform="translate(6, 4)">
    <!-- Main M facets -->
    <polygon points="2,30 8,4 14,4 9,30" class="origami-solid" />
    <polygon points="12,14 17,4 21,4 15,22" class="origami-facet" />
    <polygon points="19,14 25,4 29,4 23,30 18,30" class="origami-solid" />
    <!-- Dynamic C fold terminal -->
    <path d="M 23 4 C 30 4, 36 9, 36 17 C 36 25, 29 30, 23 30 L 26 24 C 29 24, 31 21, 31 17 C 31 13, 29 10, 25 10 Z" class="origami-solid" />
  </g>
  <!-- Typography -->
  <text x="52" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
