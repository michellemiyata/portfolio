<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 40" fill="none" class="miyata-logo">
  <!-- Monogram: Dual Gateway Arches + Embracing Circular Arc -->
  <g class="logo-mark" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left arch -->
    <path d="M 8 32 C 8 18, 11 9, 19 9 C 24 9, 26 14, 26 21" />
    <!-- Right arch sharing center -->
    <path d="M 26 21 C 26 14, 28 9, 33 9 C 41 9, 44 18, 44 32" />
    <!-- Outer delicate embracing crescent for 'C' / space -->
    <path d="M 52 14 C 55 18, 55 24, 52 28" opacity="0.6" stroke-width="2" />
    <!-- Small subtle focal node/accent point -->
    <circle cx="26" cy="30" r="1.5" fill="currentColor" />
  </g>
  <!-- Spaced Architectural Typography -->
  <text x="68" y="26" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" letter-spacing="0.16em" fill="currentColor">MIYATA<tspan font-weight="300" letter-spacing="0.22em" opacity="0.75"> CREATIVE</tspan></text>
</svg>
