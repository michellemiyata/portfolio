<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" fill="none">
  <style>
    .monoline-path {
      stroke: #1A1514;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .text-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      fill: #1A1514;
    }
    .text-sub {
      font-weight: 400;
      fill: #4A3E3C;
    }
    @media (prefers-color-scheme: dark) {
      .monoline-path { stroke: #FFFFFF; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Style A: Precision Monoline M Mark -->
  <g transform="translate(6, 6)">
    <path class="monoline-path" d="M 4 28 V 8 L 14 18 L 24 8 V 28 M 9 28 V 16 L 14 21 L 19 16 V 28" />
  </g>
  <!-- Wordmark -->
  <text x="48" y="27" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
