<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" fill="none" class="miyata-logo">
  <!-- Monogram: Kizuna Continuous Loop forming M and gentle C -->
  <g class="logo-mark" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 30 C 6 22, 8 10, 16 10 C 23 10, 24 24, 28 24 C 32 24, 33 10, 40 10 C 48 10, 50 20, 46 27 C 43 32, 34 32, 30 28" />
  </g>
  <!-- Typography -->
  <text x="64" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.01em" fill="currentColor">miyata<tspan font-weight="600" fill="currentColor">creative</tspan><tspan fill="#B28F81" font-weight="bold">.</tspan></text>
</svg>
