<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none" class="miyata-logo">
  <!-- Monogram: Refined Editorial Monogram MC -->
  <g class="logo-mark">
    <!-- Serif 'M' silhouette with delicate organic curve -->
    <path d="M 8 32 L 8 9 L 13 9 L 20 22 L 27 9 L 32 9 L 32 32 L 28 32 L 28 14 L 21 26 L 19 26 L 12 14 L 12 32 Z" fill="currentColor" />
    <!-- Overlapping C sweep with warm accent stroke -->
    <path d="M 45 14 C 41 10, 34 10, 31 14 C 27 19, 27 24, 31 28 C 35 32, 42 32, 46 28" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
  <!-- Typography: Editorial Serif 'Miyata' + Clean Sans 'Creative' -->
  <text x="62" y="27" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" font-weight="600" fill="currentColor">Miyata</text>
  <text x="145" y="26" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="0.12em" fill="currentColor" opacity="0.8">CREATIVE</text>
</svg>
