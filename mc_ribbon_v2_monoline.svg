<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .monoline-path {
      stroke: #1A1514;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .text-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.08em;
      fill: #1A1514;
    }
    .text-sub {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.08em;
      fill: #4A3E3C;
    }
    @media (prefers-color-scheme: dark) {
      .monoline-path { stroke: #FFFFFF; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Ribbon Variation 2: Minimalist Monoline Ribbon -->
  <g transform="translate(6, 4)">
    <!-- Continuous Rounded Tube M -->
    <path d="M 4 28 V 7 Q 4 4 7 4 Q 10 4 13 8 L 16 13 L 19 8 Q 22 4 25 4 Q 28 4 28 7 V 22" class="monoline-path" fill="none" />
    <!-- Seamless Loop into C Arc -->
    <path d="M 36 10 C 31 5, 23 7, 23 15 C 23 23, 31 27, 36 22" class="monoline-path" fill="none" />
  </g>
  <!-- Typography -->
  <text x="52" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
