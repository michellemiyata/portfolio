<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .mc-stroke {
      stroke: #1A1514;
      stroke-width: 3.2;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .text-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.08em;
      fill: #1A1514;
    }
    .text-sub {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.08em;
      fill: #4A3E3C;
    }
    @media (prefers-color-scheme: dark) {
      .mc-stroke { stroke: #FFFFFF; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- MC Concept 1: Precision Architectural Interlocking MC -->
  <g transform="translate(6, 4)">
    <!-- Architectural M -->
    <path class="mc-stroke" d="M 4 30 V 4 L 16 18 L 28 4 V 30" />
    <!-- Interlocking C bracket -->
    <path class="mc-stroke" d="M 36 10 H 22 M 22 24 H 36" />
    <path class="mc-stroke" d="M 22 10 V 24" />
  </g>
  <!-- Studio Typography -->
  <text x="54" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
