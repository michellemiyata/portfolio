<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .kumo-stroke { stroke: #B28F81; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #B28F81; }
    @media (prefers-color-scheme: dark) {
      .kumo-stroke { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Hybrid 5: Japanese Kumo Cloud Crest -->
  <g transform="translate(6, 4)">
    <!-- Soft cloud crest forming M -->
    <path d="M 4 25 C 4 15, 6 6, 12 6 C 18 6, 18 14, 22 14 C 26 14, 26 6, 32 6 C 38 6, 40 15, 40 25" class="kumo-stroke" fill="none" />
    <path d="M 12 25 V 14 M 32 25 V 14" class="kumo-stroke" fill="none" opacity="0.6" />
    <!-- Receptive C arc -->
    <path d="M 44 11 C 41 8, 36 10, 36 17 C 36 24, 41 26, 44 23" class="kumo-stroke" fill="none" />
  </g>
  <text x="58" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
