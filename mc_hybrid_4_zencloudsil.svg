<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .cloud-outer { stroke: #1A1514; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mc-inner { stroke: #1A1514; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #B28F81; }
    @media (prefers-color-scheme: dark) {
      .cloud-outer { stroke: #FFFFFF; }
      .mc-inner { stroke: #FFFFFF; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Hybrid 4: Serene Zen Cloud Silhouette -->
  <g transform="translate(6, 4)">
    <path d="M 6 26 C 1 26, 1 17, 6 17 C 6 9, 15 7, 20 12 C 24 7, 33 8, 35 15 C 41 15, 43 21, 41 26 Z" class="cloud-outer" fill="none" />
    <path d="M 12 22 V 15 L 18 20 L 24 15 V 22" class="mc-inner" fill="none" />
    <path d="M 33 16 C 30 14, 27 16, 27 19 C 27 22, 30 23, 33 21" class="mc-inner" fill="none" />
  </g>
  <text x="56" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
