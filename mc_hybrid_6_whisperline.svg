    <path d="M 6 25 C 6 12, 12 12, 16 18 C 20 24, 24 12, 28 12 C 32 12, 34 18, 34 25" class="whisper-stroke" fill="none" />
    <path d="M 37 13 C 33 9, 28 12, 28 19 C 28 26, 34 28, 38 23" class="whisper-stroke" fill="none" />
  </g>
  <text x="56" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
