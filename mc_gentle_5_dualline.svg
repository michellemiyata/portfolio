<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .dual-dark { stroke: #1A1514; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .dual-accent { stroke: #B28F81; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .dual-dark { stroke: #FFFFFF; }
      .dual-accent { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Gentle 5: Delicate Dual-Line Whisper -->
  <g transform="translate(6, 6)">
    <!-- Parallel outer M line -->
    <path d="M 4 26 V 6 L 14 18 L 24 6 V 26" class="dual-dark" fill="none" />
    <!-- Parallel inner M line -->
    <path d="M 7 26 V 11 L 14 19 L 21 11 V 26" class="dual-accent" fill="none" />
    <!-- Parallel C line -->
    <path d="M 36 9 C 30 5, 23 8, 23 16 C 23 24, 30 27, 36 23" class="dual-dark" fill="none" />
  </g>
  <text x="52" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
