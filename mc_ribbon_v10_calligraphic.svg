<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .brush-m { stroke: #1A1514; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    .brush-c { stroke: #B28F81; stroke-width: 3.4; stroke-linecap: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 0.08em; fill: #1A1514; }
    .text-sub { font-size: 17px; font-weight: 400; letter-spacing: 0.08em; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .brush-m { stroke: #FFFFFF; }
      .brush-c { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Ribbon Variation 10: Modern Japanese Gestural Calligraphic Ribbon MC -->
  <g transform="translate(6, 4)">
    <path d="M 4 28 C 6 16, 8 7, 13 7 C 16 7, 17 14, 18 20 C 19 14, 21 7, 24 7 C 27 7, 28 16, 27 28" class="brush-m" fill="none" />
    <path d="M 36 10 C 31 5, 25 8, 25 17 C 25 25, 31 29, 36 24" class="brush-c" fill="none" />
  </g>
  <text x="52" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
