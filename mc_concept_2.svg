<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .m-mark {
      fill: #1A1514;
    }
    .c-mark {
      stroke: #B28F81;
      stroke-width: 3.2;
      stroke-linecap: round;
    }
    .text-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.08em;
      fill: #1A1514;
    }
    .text-sub {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.08em;
      fill: #4A3E3C;
    }
    @media (prefers-color-scheme: dark) {
      .m-mark { fill: #FFFFFF; }
      .c-mark { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- MC Concept 2: Nested Minimalist MC (M Cradling Open C) -->
  <g transform="translate(6, 4)">
    <!-- Architectural Solid M -->
    <path class="m-mark" d="M 2 30 V 4 H 8 L 16 16 L 24 4 H 30 V 30 H 25 V 12 L 18 22 H 14 L 7 12 V 30 H 2 Z" />
    <!-- C nestled gracefully in the lower central space -->
    <path class="c-mark" d="M 20 22 C 18 19, 14 19, 12 22 C 10 25, 10 27, 12 29 C 14 32, 18 32, 20 29" fill="none" />
  </g>
  <!-- Typography -->
  <text x="50" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
