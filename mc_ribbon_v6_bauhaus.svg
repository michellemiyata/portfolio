<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .bauhaus-main { fill: #1A1514; }
    .bauhaus-fold { fill: #B28F81; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 0.08em; fill: #1A1514; }
    .text-sub { font-size: 17px; font-weight: 400; letter-spacing: 0.08em; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .bauhaus-main { fill: #FFFFFF; }
      .bauhaus-fold { fill: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Ribbon Variation 6: Bauhaus 45 Flat-Fold MC -->
  <g transform="translate(6, 4)">
    <!-- 45-degree folded ribbon segments -->
    <path d="M 2 30 V 10 L 8 4 H 14 L 8 10 V 30 Z" class="bauhaus-main" />
    <path d="M 8 10 L 17 22 L 21 16 L 14 6 Z" class="bauhaus-fold" />
    <path d="M 17 22 L 23 30 H 29 L 21 16 Z" class="bauhaus-main" />
    <path d="M 23 4 H 35 V 10 H 29 V 24 H 35 V 30 H 23 Z" class="bauhaus-main" />
  </g>
  <text x="54" y="26" class="text-title">MIYATA<tspan class="text-sub">CREATIVE</tspan></text>
</svg>
