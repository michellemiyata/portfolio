<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .petal-stroke { stroke: #B28F81; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .petal-stroke { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Gentle 4: Continuous Petal Ribbon -->
  <g transform="translate(6, 6)">
    <!-- Left M stem -->
    <path d="M 4 26 V 6 L 12 18 C 12 18, 16 2, 20 2 C 24 2, 28 18, 28 18 L 36 6 V 26" class="petal-stroke" fill="none" />
    <!-- Loop C sweep -->
    <path d="M 36 26 C 36 26, 30 28, 24 24 C 20 20, 20 12, 24 8" class="petal-stroke" fill="none" opacity="0.8" />
  </g>
  <text x="52" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
