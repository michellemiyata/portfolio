<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" fill="none">
  <style>
    .text-brand {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      fill: #1A1514;
    }
    .text-sub {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: -0.01em;
      fill: #4A3E3C;
    }
    .accent-dot {
      fill: #B28F81;
    }
    @media (prefers-color-scheme: dark) {
      .text-brand { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
      .accent-dot { fill: #9A86A8; }
    }
  </style>
  <!-- Minimalist Studio Monogram square badge -->
  <g transform="translate(6, 7)">
    <rect x="0" y="0" width="26" height="26" rx="6" fill="#1A1514" class="text-brand" />
    <path d="M 6 20 V 6 L 13 14 L 20 6 V 20" stroke="#FDFBF7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <!-- Studio Wordmark -->
  <text x="42" y="26" class="text-brand">Miyata<tspan class="text-sub">Creative</tspan></text>
  <circle cx="192" cy="18" r="3" class="accent-dot" />
</svg>
