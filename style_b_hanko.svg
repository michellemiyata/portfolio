<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" fill="none">
  <style>
    .hanko-bg { fill: #C6543C; }
    .hanko-symbol { stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Style B: Japanese Modern Hanko Seal -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="28" height="28" rx="5" class="hanko-bg" />
    <!-- Stylized Geometric Kanji / Monogram Mark -->
    <path class="hanko-symbol" d="M 7 7 H 21 M 14 7 V 21 M 7 14 H 21 M 9 21 H 19" />
  </g>
  <!-- Refined Typography -->
  <text x="46" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
