<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .origami-left { fill: #1A1514; }
    .origami-fold { fill: #B28F81; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .origami-left { fill: #FFFFFF; }
      .origami-fold { fill: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Gentle 2: Soft-Fold Origami -->
  <g transform="translate(6, 4)">
    <!-- Soft-curved M stem -->
    <path d="M 2 30 C 2 15, 6 6, 12 6 C 15 6, 17 9, 16 16 L 14 26 C 14 28, 12 30, 9 30 Z" class="origami-left" />
    <path d="M 12 28 C 14 18, 18 6, 23 6 C 26 6, 28 9, 27 16 L 25 26 C 25 28, 23 30, 20 30 Z" class="origami-left" />
    <!-- Friendly curved C terminal -->
    <path d="M 24 6 C 30 4, 36 9, 36 17 C 36 25, 29 30, 23 30 L 26 24 C 29 24, 31 21, 31 17 C 31 13, 28 10, 25 10 Z" class="origami-fold" />
  </g>
  <text x="52" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
