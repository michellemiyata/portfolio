<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .wave-upper { stroke: #2D6A4F; stroke-width: 3.2; stroke-linecap: round; }
    .wave-lower { stroke: #B28F81; stroke-width: 3.2; stroke-linecap: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 400; fill: #4A3E3C; }
    @media (prefers-color-scheme: dark) {
      .wave-upper { stroke: #52B788; }
      .wave-lower { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #E0DEE8; }
    }
  </style>
  <!-- Style D: Organic Sensory Wave / Accessibility Stream -->
  <g transform="translate(6, 6)">
    <!-- Primary wave -->
    <path class="wave-upper" d="M 2 18 Q 8 6 15 14 T 28 10" fill="none" />
    <!-- Harmonizing lower wave -->
    <path class="wave-lower" d="M 6 24 Q 12 12 19 20 T 32 16" fill="none" opacity="0.85" />
  </g>
  <!-- Typography -->
  <text x="50" y="26" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
