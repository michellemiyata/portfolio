<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .cashmere-stroke { stroke: #B28F81; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #B28F81; }
    @media (prefers-color-scheme: dark) {
      .cashmere-stroke { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Hybrid 2: Pure Cashmere Arches -->
  <g transform="translate(6, 6)">
    <!-- Pillowy M -->
    <path d="M 4 25 V 10 C 4 5, 8 4, 12 4 C 16 4, 18 7, 18 11 V 25" class="cashmere-stroke" fill="none" />
    <path d="M 18 11 C 18 7, 20 4, 24 4 C 28 4, 32 5, 32 10 V 25" class="cashmere-stroke" fill="none" />
    <!-- Open C -->
    <path d="M 43 8 C 37 4, 31 7, 31 14.5 C 31 22, 37 25, 43 21" class="cashmere-stroke" fill="none" />
  </g>
  <text x="56" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
