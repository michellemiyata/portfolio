<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .cloud-border { stroke: #B28F81; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .arch-mark { stroke: #1A1514; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #B28F81; }
    @media (prefers-color-scheme: dark) {
      .cloud-border { stroke: #9A86A8; }
      .arch-mark { stroke: #FFFFFF; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Hybrid 1: Floating Cloud Arches -->
  <g transform="translate(6, 4)">
    <!-- Soft cloud contour -->
    <path d="M 6 23 C 1 23, 1 15, 6 15 C 6 8, 14 6, 18 10 C 22 6, 30 7, 32 13 C 37 13, 39 18, 38 23 Z" class="cloud-border" fill="none" opacity="0.45" />
    <!-- Inner pillowy soft arches -->
    <path d="M 10 24 V 14 C 10 11, 13 10, 15 10 C 17 10, 19 12, 19 14 V 24" class="arch-mark" fill="none" />
    <path d="M 19 14 C 19 12, 21 10, 23 10 C 25 10, 28 11, 28 14 V 24" class="arch-mark" fill="none" />
    <path d="M 36 12 C 32 10, 29 12, 29 17 C 29 22, 33 24, 36 21" class="arch-mark" fill="none" />
  </g>
  <text x="54" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
