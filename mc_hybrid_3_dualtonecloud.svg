<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 40" fill="none">
  <style>
    .cloud-bg { fill: #B28F81; opacity: 0.22; }
    .m-stroke { stroke: #1A1514; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .c-stroke { stroke: #B28F81; stroke-width: 2.4; stroke-linecap: round; }
    .text-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; fill: #1A1514; }
    .text-sub { font-weight: 300; fill: #B28F81; }
    @media (prefers-color-scheme: dark) {
      .cloud-bg { fill: #9A86A8; opacity: 0.25; }
      .m-stroke { stroke: #FFFFFF; }
      .c-stroke { stroke: #9A86A8; }
      .text-title { fill: #FFFFFF; }
      .text-sub { fill: #9A86A8; }
    }
  </style>
  <!-- Hybrid 3: Dual-Tone Cashmere Cloud -->
  <g transform="translate(6, 4)">
    <!-- Cloud backdrop silhouette -->
    <path d="M 16 24 C 11 24, 11 16, 16 16 C 16 9, 24 7, 28 11 C 32 7, 40 8, 42 14 C 47 14, 49 19, 48 24 Z" class="cloud-bg" />
    <!-- Charcoal M arches -->
    <path d="M 4 25 V 10 C 4 5, 8 4, 12 4 C 16 4, 18 7, 18 11 V 25" class="m-stroke" fill="none" />
    <path d="M 18 11 C 18 7, 20 4, 24 4 C 28 4, 32 5, 32 10 V 25" class="m-stroke" fill="none" />
    <!-- Terracotta C -->
    <path d="M 43 8 C 37 4, 31 7, 31 14.5 C 31 22, 37 25, 43 21" class="c-stroke" fill="none" />
  </g>
  <text x="56" y="25" class="text-title">Miyata<tspan class="text-sub">Creative</tspan></text>
</svg>
